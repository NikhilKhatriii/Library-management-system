name: library_managementsystem
description: "LibreFlow — a premium, Apple-inspired Library Management System."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Typography
  google_fonts: ^6.2.1

  # Animation
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # Local persistence
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Media
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # Documents / codes
  pdf: ^3.11.1
  printing: ^5.13.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Charts
  fl_chart: ^0.68.0

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Biometrics
  local_auth: ^2.3.0

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  logger: ^2.4.0
  connectivity_plus: ^6.0.5
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # Custom fonts can be added here once font files are provided.
  # fonts:
  #   - family: SFProDisplay
  #     fonts:
  #       - asset: assets/fonts/SFProDisplay-Regular.ttf
  #       - asset: assets/fonts/SFProDisplay-Bold.ttf
  #         weight: 700
